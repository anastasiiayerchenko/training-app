services:
  # BLUE ENVIRONMENT (Default)
  auth-service-blue:
    build: ./auth_service
    container_name: auth-service-blue
    volumes:
      - ./auth_service/db:/app/db

  training-service-blue:
    build: ./training_service
    container_name: training-service-blue
    volumes:
      - ./training_service/db:/app/db
    environment:
      - AUTH_SERVICE_URL=http://auth-service-blue:8082
    depends_on:
      - auth-service-blue

  records-service-blue:
    build: ./records_service
    container_name: records-service-blue
    volumes:
      - ./records_service/db:/app/db
    environment:
      - TRAINING_SERVICE_URL=http://training-service-blue:8080
      - AUTH_SERVICE_URL=http://auth-service-blue:8082
    depends_on:
      - training-service-blue
      - auth-service-blue

  frontend-blue:
    build: ./frontend
    container_name: frontend-blue
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - auth-service-blue
      - training-service-blue
      - records-service-blue

  # GREEN ENVIRONMENT
  auth-service-green:
    build: ./auth_service
    container_name: auth-service-green
    ports:
      - "9082:8082"
    volumes:
      - ./auth_service/db:/app/db
    profiles:
      - green

  training-service-green:
    build: ./training_service
    container_name: training-service-green
    ports:
      - "9080:8080"
    volumes:
      - ./training_service/db:/app/db
    environment:
      - AUTH_SERVICE_URL=http://auth-service-green:8082
    depends_on:
      - auth-service-green
    profiles:
      - green

  records-service-green:
    build: ./records_service
    container_name: records-service-green
    ports:
      - "9081:8081"
    volumes:
      - ./records_service/db:/app/db
    environment:
      - TRAINING_SERVICE_URL=http://training-service-green:8080
      - AUTH_SERVICE_URL=http://auth-service-green:8082
    depends_on:
      - training-service-green
      - auth-service-green
    profiles:
      - green

  frontend-green:
    build: ./frontend
    container_name: frontend-green
    ports:
      - "9000:80"
    depends_on:
      - auth-service-green
      - training-service-green
      - records-service-green
    profiles:
      - green