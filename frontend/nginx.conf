# Захист від DDoS: ліміт запитів з однієї IP-адреси
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

server {
    listen 80;
    server_name strivio-training.space www.strivio-training.space;
    return 301 https://strivio-training.space$request_uri;
}

server {
    listen 443 ssl;
    server_name strivio-training.space www.strivio-training.space;

    ssl_certificate /etc/letsencrypt/live/strivio-training.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strivio-training.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Захист від великих файлів/навантажень
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for Auth service
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://auth-service-blue:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Training service
    location /api/training/ {
        limit_req zone=api_limit burst=15 nodelay;
        
        # Block external DELETE requests for security (IDOR prevention)
        if ($request_method = DELETE) {
            return 403;
        }

        proxy_pass http://training-service-blue:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for Records service
    location /api/records/ {
        limit_req zone=api_limit burst=15 nodelay;

        # Block external DELETE requests for security (IDOR prevention)
        if ($request_method = DELETE) {
            return 403;
        }

        proxy_pass http://records-service-blue:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
