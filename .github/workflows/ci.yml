name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile SQLite
        run: gcc -c db/sqlite3.c -o db/sqlite3.o

      - name: Build application
        run: g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-app
          path: app

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile SQLite
        run: gcc -c db/sqlite3.c -o db/sqlite3.o

      - name: Build application
        run: g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl

      - name: Run unit tests and start server
        run: |
          ./app &
          APP_PID=$!
          sleep 2

          echo "--- Unit test results ---"
          HEALTH=$(curl -s http://localhost:8080/health)
          echo "Health check: $HEALTH"

          echo "--- API integration tests ---"
          
          # Test: Create athlete
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/athletes \
            -H "Content-Type: application/json" \
            -d '{"name":"TestAthlete","age":20}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "POST /athletes -> $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "201" ]; then echo "FAILED: expected 201"; kill $APP_PID; exit 1; fi

          # Test: Get all athletes
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/athletes)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "GET /athletes -> $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "FAILED: expected 200"; kill $APP_PID; exit 1; fi

          # Test: Get athlete by ID
          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:8080/athletes/1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "GET /athletes/1 -> $HTTP_CODE"

          # Test: Invalid athlete (empty name)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8080/athletes \
            -H "Content-Type: application/json" \
            -d '{"name":"","age":20}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "POST /athletes (empty name) -> $HTTP_CODE"
          if [ "$HTTP_CODE" != "400" ]; then echo "FAILED: expected 400"; kill $APP_PID; exit 1; fi

          echo "All tests passed!"
          kill $APP_PID

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t training-app .

      - name: Verify Docker image
        run: |
          docker run -d -p 8080:8080 --name test-container training-app
          sleep 3
          HEALTH=$(curl -s http://localhost:8080/health)
          echo "Health check: $HEALTH"
          docker stop test-container
          docker rm test-container
