name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Service
        run: |
          cd auth_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

      - name: Build Training Service
        run: |
          cd training_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

      - name: Build Records Service
        run: |
          cd records_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

  docker:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker-compose up --build -d
          sleep 5

      - name: Health Checks
        run: |
          curl -s -f http://localhost:8082/health || exit 1
          curl -s -f http://localhost:8080/health || exit 1
          curl -s -f http://localhost:8081/health || exit 1
          echo "All services are up and running!"
