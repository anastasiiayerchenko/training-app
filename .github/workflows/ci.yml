name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Auth Service
        run: |
          cd auth_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

      - name: Build Training Service
        run: |
          cd training_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

      - name: Build Records Service
        run: |
          cd records_service
          gcc -c db/sqlite3.c -o db/sqlite3.o
          g++ -std=c++17 main.cpp db/sqlite3.o -o app -lpthread -ldl
          ./app & APP_PID=$! && sleep 2 && kill $APP_PID

  docker:
    name: Docker Compose Integration
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          mkdir -p certs/live/strivio-training.space
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout certs/live/strivio-training.space/privkey.pem -out certs/live/strivio-training.space/fullchain.pem -subj "/CN=strivio-training.space"
          docker compose up --build -d
          sleep 10

      - name: Health Checks
        run: |
          docker compose ps
          docker compose logs
          curl -k -f -v https://localhost/api/auth/health || exit 1
          curl -k -f -v https://localhost/api/training/health || exit 1
          curl -k -f -v https://localhost/api/records/health || exit 1
          echo "All services are up and running!"
